<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

.hero{padding:72px 20px;text-align:center;background:radial-gradient(60% 80% at 50% 0,var(--p),transparent)}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));padding:40px 20px;max-width:1000px;margin:auto}
.card{background:#151b33;border:1px solid #232a4a;border-radius:16px;padding:20px}
footer{padding:28px;text-align:center;opacity:.6;font-size:13px}</style></head>
<body><section class="hero"><h1>Landing Starter</h1>

<section class="grid">
<div class="card"><h3>Fast</h3><p>يعمل محليًا، بلا انتظار وبلا رفع بياناتك لأي سيرفر.</p></div>
<div class="card"><h3>Private</h3><p>كل شيء داخل المتصفح/جهازك. لا تتبّع.</p></div>
<div class="card"><h3>Free core</h3><p>الأساس مجاني. النسخة الكاملة اختيارية.</p></div>
</section><footer id="get">© 2026 - built locally by the agent.</footer></body></html>
