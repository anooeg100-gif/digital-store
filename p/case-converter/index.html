<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Converter</title>
<style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:0;padding:16px}
textarea{width:100%;height:34vh;padding:12px;background:#111827;color:#e2e8f0;border:0;border-radius:8px}
button{margin:6px 6px 0 0;padding:8px 12px;border:0;border-radius:8px;background:#6366f1;color:#fff;cursor:pointer}</style>
</head><body><textarea id="t"></textarea>
<button onclick="x(v=>v.toUpperCase())">UPPER</button>
<button onclick="x(v=>v.toLowerCase())">lower</button>
<button onclick="x(v=>v.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase()))">Title</button>
<button onclick="x(v=>v.replace(/([a-z])([A-Z])/g,'$1_$2').replace(/\s+/g,'_').toLowerCase())">snake_case</button>
<button onclick="x(v=>v.split(/[\s_-]+/).map((w,i)=>i?w[0].toUpperCase()+w.slice(1):w.toLowerCase()).join(''))">camelCase</button>
<script>const t=document.getElementById('t');function x(f){t.value=f(t.value)}</script></body></html>
