<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG Optimizer</title><meta name="description" content="Minify, clean, and optimize SVG files. Remove metadata, merge paths, reduce precision. Client-side only."><style>
:root{--bg:#0b1020;--fg:#e6e9f5;--card:#151b33;--line:#232a4a;--p:#6366f1;--ok:#34d399;--err:#f87171;--warn:#fbbf24;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);color:var(--fg);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:clamp(20px,3vw,28px);margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.row{display:grid;gap:16px;grid-template-columns:1fr 1fr}@media (max-width:900px){.row{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.panel header{padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
.panel header h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0;color:var(--muted)}
textarea{flex:1;border:none;outline:none;background:transparent;color:var(--fg);font-family:inherit;font-size:14px;line-height:1.6;padding:16px;resize:vertical;min-height:420px}
textarea::placeholder{color:var(--muted)}
.actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--p)}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:8px;min-height:40px}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}.status.warn{color:var(--warn)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(52,211,153,.15);color:var(--ok);border:1px solid rgba(52,211,153,.3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;color:var(--muted);padding:0 16px 12px}
.opt{display:flex;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;font-size:13px}
.opt label{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=file]{display:none}
.preview{aspect-ratio:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview svg{max-width:100%;max-height:100%}
.footer{text-align:center;padding:24px;color:var(--muted);font-size:13px}
a{color:var(--p)}a:hover{text-decoration:underline}
</style></head><body><div class="wrap">
<header><div><h1>SVG Optimizer</h1><div class="sub">Minify • Clean metadata • Reduce precision • Merge paths — 100% client-side</div></div><span class="badge">FREE</span></header>
<div class="row">
  <section class="panel"><header><h2>Input SVG</h2></header>
  <div class="opt">
    <button class="btn" id="loadFile">Load SVG File</button>
    <input type="file" id="fileIn" accept=".svg">
    <label><input type="checkbox" id="pretty" checked> Pretty print output</label>
  </div>
  <textarea id="in" spellcheck="false" placeholder="Paste SVG code here, or load a file..."></textarea>
  <div class="actions">
    <button class="btn primary" id="opt">Optimize</button>
    <button class="btn" id="min">Minify Only</button>
    <button class="btn" id="clr">Clear</button>
    <button class="btn" id="cpy">Copy Result</button>
    <button class="btn" id="dwn">Download .svg</button>
  </div>
  <div class="status" id="stIn"></div>
  <div class="kv"><span>Original:</span><span id="szIn">—</span><span>Optimized:</span><span id="szOut">—</span><span>Reduction:</span><span id="pct">—</span></div>
</section>
  <section class="panel"><header><h2>Output SVG</h2></header>
  <textarea id="out" spellcheck="false" readonly placeholder="Optimized SVG appears here..."></textarea>
  <div class="preview" id="previewIn"></div>
  <div class="preview" id="previewOut" style="margin-top:8px"></div>
</section>
</div>
<footer>No data leaves your browser. <a href="https://github.com/anooeg100-gif/digital-store">View source</a> · <a href="https://anooeg100-gif.github.io/digital-store/">← Back to store</a></footer>
<script>
const $=s=>document.querySelector(s);
const inEl=$('#in'),outEl=$('#out'),stIn=$('#stIn'),szIn=$('#szIn'),szOut=$('#szOut'),pct=$('#pct'),previewIn=$('#previewIn'),previewOut=$('#previewOut');
function setStatus(el,ok,msg){el.className='status '+(ok?'ok':'err');el.textContent=msg}
function updateSize(){szIn.textContent=inEl.value.length<1024?inEl.value.length+' B':(inEl.value.length/1024).toFixed(1)+' KB';
  szOut.textContent=outEl.value.length<1024?outEl.value.length+' B':(outEl.value.length/1024).toFixed(1)+' KB';
  if(inEl.value.length)pct.textContent=Math.round((1-outEl.value.length/inEl.value.length)*100)+'%';else pct.textContent='—'}
function renderPreview(svg,container){try{container.innerHTML=svg}catch(e){container.textContent='Preview error'}}
function optimize(full=true){
  const svg=inEl.value.trim();if(!svg){setStatus(stIn,false,'Empty input');return}
  try{
    const parser=new DOMParser();const doc=parser.parseFromString(svg,'image/svg+xml');
    const err=doc.querySelector('parsererror');if(err)throw new Error('Invalid SVG');
    const root=doc.documentElement;
    if(!root.tagName.includes('svg'))throw new Error('Not an SVG document');
    renderPreview(svg,previewIn);
    // Remove metadata, comments, empty groups, etc.
    const remove=(sel)=>doc.querySelectorAll(sel).forEach(e=>e.remove());
    remove('metadata');remove('title:not(:first-child)');remove('desc');remove('comment()');
    if(full){
      // Remove editor metadata
      remove('[id^="Svgjs"],[id^="svg-editor"],[class*="svg-editor"]');
      remove('[data-*]');
      // Merge adjacent paths with same style (simplified)
      const paths=Array.from(root.querySelectorAll('path'));
      for(let i=paths.length-1;i>0;i--){
        const a=paths[i],b=paths[i-1];
        if(a.getAttribute('fill')===b.getAttribute('fill')&&a.getAttribute('stroke')===b.getAttribute('stroke')&&
           a.getAttribute('fill')!==null&&!a.hasAttribute('transform')&&!b.hasAttribute('transform')){
          const d1=a.getAttribute('d'),d2=b.getAttribute('d');
          if(d1&&d2&&!d1.includes('M')&&!d2.includes('M')){a.setAttribute('d',d2+' '+d1);b.remove()}
        }
      }
      // Reduce numeric precision
      const walk=el=>{if(el.attributes){Array.from(el.attributes).forEach(attr=>{if(/^[\d\.\-eE, ]+$/.test(attr.value)||attr.name==='d'){
        attr.value=attr.value.replace(/(\d+\.\d{4,})/g,m=>parseFloat(m).toFixed(3)).replace(/\.?0+([, ])/g,'$1').replace(/,0+([, ])/g,'$1')
      }})}Array.from(el.children).forEach(walk)};walk(root)}
    const serializer=new XMLSerializer();let out=serializer.serializeToString(doc);
    if($('#pretty').checked){out=out.replace(/></g,'>\n<').replace(/^</,'<').replace(/>$/,'>\n')}
    outEl.value=out;updateSize();renderPreview(out,previewOut);setStatus(stIn,true,full?'Optimized ✓':'Minified ✓')
  }catch(e){setStatus(stIn,false,e.message)}
}
$('#opt').onclick=()=>optimize(true);$('#min').onclick=()=>optimize(false);
$('#clr').onclick=()=>{inEl.value='';outEl.value='';previewIn.innerHTML='';previewOut.innerHTML='';updateSize();setStatus(stIn,true,'Cleared')};
$('#cpy').onclick=async()=>{await navigator.clipboard.writeText(outEl.value);setStatus(stIn,true,'Copied')};
$('#dwn').onclick=()=>{const b=new Blob([outEl.value],{type:'image/svg+xml'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='optimized.svg';a.click();URL.revokeObjectURL(u)};
$('#loadFile').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{inEl.value=r.result;updateSize();setStatus(stIn,true,'File loaded: '+f.name)};r.readAsText(f)};
inEl.addEventListener('input',updateSize);
</script></body></html>
