<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTTP Status Codes Reference</title><meta name="description" content="Complete HTTP status codes reference with search, categories, and descriptions. Offline-ready."><style>
:root{--bg:#0b1020;--fg:#e6e9f5;--card:#151b33;--line:#232a4a;--p:#6366f1;--ok:#34d399;--err:#f87171;--warn:#fbbf24;--info:#60a5fa;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,monospace;background:var(--bg);color:var(--fg);min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:clamp(20px,3vw,28px);margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.actions{display:flex;gap:8px;padding:12px 0 0 0;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--p)}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
input{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-family:inherit;font-size:14px;width:100%;max-width:400px}
input::placeholder{color:var(--muted)}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;background:rgba(255,255,255,.02);position:sticky;top:0}
tr:hover{background:rgba(255,255,255,.02)}
.code{font-family:monospace;font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;min-width:60px;text-align:center}
.cat-1xx{background:rgba(96,165,250,.2);color:var(--info);border:1px solid rgba(96,165,250,.3)}
.cat-2xx{background:rgba(52,211,153,.2);color:var(--ok);border:1px solid rgba(52,211,153,.3)}
.cat-3xx{background:rgba(251,191,36,.2);color:var(--warn);border:1px solid rgba(251,191,36,.3)}
.cat-4xx{background:rgba(248,113,113,.2);color:var(--err);border:1px solid rgba(248,113,113,.3)}
.cat-5xx{background:rgba(168,85,247,.2);color:#c084fc;border:1px solid rgba(168,85,247,.3)}
.category{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-left:8px}
.footer{text-align:center;padding:24px;color:var(--muted);font-size:13px}
a{color:var(--p)}a:hover{text-decoration:underline}
</style></head><body><div class="wrap">
<header><div><h1>HTTP Status Codes Reference</h1><div class="sub">Complete list with descriptions, categories, and search — Works offline</div></div><span class="badge">FREE</span></header>
<div class="panel">
  <input type="text" id="search" placeholder="Search by code, name, or description..." oninput="filter()">
  <div class="actions" style="margin-top:12px">
    <button class="btn" onclick="showCat('all')">All</button>
    <button class="btn" onclick="showCat('1xx')">1xx Informational</button>
    <button class="btn" onclick="showCat('2xx')">2xx Success</button>
    <button class="btn" onclick="showCat('3xx')">3xx Redirection</button>
    <button class="btn" onclick="showCat('4xx')">4xx Client Error</button>
    <button class="btn" onclick="showCat('5xx')">5xx Server Error</button>
    <button class="btn" onclick="showCat('unofficial')">Unofficial</button>
  </div>
</div>
<div class="table-wrap"><table id="tbl"><thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Description</th></tr></thead><tbody></tbody></table></div>
<footer>Data from IANA + RFCs. No data leaves your browser. <a href="https://github.com/anooeg100-gif/digital-store">View source</a> · <a href="https://anooeg100-gif.github.io/digital-store/">← Back to store</a></footer>
<script>
const CODES=[
  [100,"Continue","1xx","Client should continue request"],[101,"Switching Protocols","1xx","Server agrees to switch protocol"],[102,"Processing","1xx","WebDAV: Request is being processed"],[103,"Early Hints","1xx","Link headers for preloading"],
  [200,"OK","2xx","Standard success"],[201,"Created","2xx","Resource created"],[202,"Accepted","2xx","Accepted for processing"],[203,"Non-Authoritative Information","2xx","From cache/transform"],[204,"No Content","2xx","Success, no body"],[205,"Reset Content","2xx","Reset view"],[206,"Partial Content","2xx","Range request"],[207,"Multi-Status","2xx","WebDAV multiple"],[208,"Already Reported","2xx","WebDAV"],[226,"IM Used","2xx","Delta encoding"],
  [300,"Multiple Choices","3xx","Multiple options"],[301,"Moved Permanently","3xx","Permanent redirect"],[302,"Found","3xx","Temporary redirect"],[303,"See Other","3xx","GET other URI"],[304,"Not Modified","3xx","Cached valid"],[305,"Use Proxy","3xx","Deprecated"],[307,"Temporary Redirect","3xx","Keep method"],[308,"Permanent Redirect","3xx","Keep method permanent"],
  [400,"Bad Request","4xx","Malformed syntax"],[401,"Unauthorized","4xx","Auth required"],[402,"Payment Required","4xx","Reserved"],[403,"Forbidden","4xx","Access denied"],[404,"Not Found","4xx","Resource missing"],[405,"Method Not Allowed","4xx","Method unsupported"],[406,"Not Acceptable","4xx"],[407,"Proxy Auth Required","4xx"],[408,"Request Timeout","4xx"],[409,"Conflict","4xx","Resource conflict"],[410,"Gone","4xx","Permanently removed"],[411,"Length Required","4xx"],[412,"Precondition Failed","4xx"],[413,"Payload Too Large","4xx"],[414,"URI Too Long","4xx"],[415,"Unsupported Media Type","4xx"],[416,"Range Not Satisfiable","4xx"],[417,"Expectation Failed","4xx"],[418,"I'm a Teapot","4xx","RFC 2324"],[421,"Misdirected Request","4xx"],[422,"Unprocessable Entity","4xx","WebDAV"],[423,"Locked","4xx"],[424,"Failed Dependency","4xx"],[425,"Too Early","4xx"],[426,"Upgrade Required","4xx"],[428,"Precondition Required","4xx"],[429,"Too Many Requests","4xx","Rate limited"],[431,"Request Header Fields Too Large","4xx"],[451,"Unavailable For Legal Reasons","4xx"],
  [500,"Internal Server Error","5xx","Generic error"],[501,"Not Implemented","5xx"],[502,"Bad Gateway","5xx"],[503,"Service Unavailable","5xx"],[504,"Gateway Timeout","5xx"],[505,"HTTP Version Not Supported","5xx"],[506,"Variant Also Negotiates","5xx"],[507,"Insufficient Storage","5xx"],[508,"Loop Detected","5xx"],[510,"Not Extended","5xx"],[511,"Network Auth Required","5xx"],
  [420,"Enhance Your Calm","unofficial","Twitter rate limit"],[425,"Too Early","unofficial","Early data"],[430,"Request Header Fields Too Large","unofficial","Shopify"],[440,"Login Timeout","unofficial","Microsoft"],[444,"No Response","unofficial","Nginx"],[449,"Retry With","unofficial","Microsoft"],[450,"Blocked by Windows Parental Controls","unofficial","Microsoft"],[499,"Client Closed Request","unofficial","Nginx"],[509,"Bandwidth Limit Exceeded","unofficial","Apache"],[520,"Web Server Unknown Error","unofficial","Cloudflare"],[521,"Web Server Is Down","unofficial","Cloudflare"],[522,"Connection Timed Out","unofficial","Cloudflare"],[523,"Origin Is Unreachable","unofficial","Cloudflare"],[524,"Timeout Occurred","unofficial","Cloudflare"],[525,"SSL Handshake Failed","unofficial","Cloudflare"],[526,"Invalid SSL Certificate","unofficial","Cloudflare"],[527,"Railgun Error","unofficial","Cloudflare"],[530,"Origin DNS Error","unofficial","Cloudflare"],[598,"Network Read Timeout","unofficial"],[599,"Network Connect Timeout","unofficial"]
];
const tbody=document.querySelector('#tbl tbody');
function catClass(cat){return 'cat-'+cat.replace('unofficial','5xx')}
function render(list=CODES){tbody.innerHTML=list.map(([code,name,cat,desc])=>`<tr data-code="${code}" data-name="${name.toLowerCase()}" data-desc="${(desc||'').toLowerCase()}" data-cat="${cat}"><td><span class="code ${catClass(cat)}">${code}</span></td><td>${name}</td><td><span class="category">${cat.toUpperCase()}</span></td><td>${desc||'—'}</td></tr>`).join('')}
function filter(){const q=document.getElementById('search').value.toLowerCase().trim();const rows=tbody.querySelectorAll('tr');rows.forEach(r=>{const show=!q||r.dataset.code.includes(q)||r.dataset.name.includes(q)||r.dataset.desc.includes(q);r.style.display=show?'':"none"})}
function showCat(cat){document.querySelectorAll('#tbl tbody tr').forEach(r=>{r.style.display=(cat==='all'||r.dataset.cat===cat)?'':'none'})}
document.getElementById('search').addEventListener('input',filter);
render();
</script></body></html>
