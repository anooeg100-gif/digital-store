<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Counter - free, offline</title>
<style>body{font-family:system-ui;margin:0;background:#0f172a;color:#e2e8f0;padding:16px}
textarea{width:100%;height:45vh;padding:12px;background:#111827;color:#e2e8f0;border:0;border-radius:8px;font-size:14px}
.k{background:#1e293b;padding:10px 14px;border-radius:8px;display:inline-block;margin:6px}
b{color:#818cf8}</style></head><body>
<h3>Word &amp; Character Counter</h3><textarea id="t" oninput="c()"></textarea>
<div id="s"></div><script>
function c(){const v=document.getElementById('t').value;
const w=v.trim()?v.trim().split(/\s+/).length:0;
const l=v?v.split(/\n/).length:0;
document.getElementById('s').innerHTML=
'<div class="k"><b>'+w+'</b> words</div>'+
'<div class="k"><b>'+v.length+'</b> chars</div>'+
'<div class="k"><b>'+l+'</b> lines</div>'+
'<div class="k"><b>'+(v.trim()?Math.ceil(w/200):0)+'</b> min read</div>';}
c();</script></body></html>
