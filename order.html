<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب</title><style>body{font-family:system-ui;background:#0b1020;color:#e6e9f5;margin:0;padding:40px;max-width:760px;line-height:1.9}a{color:#a5b4fc}.box{background:#151b33;border:1px solid #232a4a;border-radius:16px;padding:20px;margin:16px 0}code{background:#0b1020;padding:2px 6px;border-radius:6px}</style></head><body><h1>إتمام الطلب</h1><div class="box"><b>المنتج:</b> <span id="p">—</span><br><b>السعر:</b> <span id="price">حسب المنتج</span></div><h3>طرق الدفع المتاحة</h3><ul><li>تواصل معنا لمعرفة طرق الدفع.</li></ul><p>بعد الدفع أرسل رقم الطلب إلى: <b>صاحب المتجر</b></p><p class="box">رقم الطلب: <code id="ref">—</code></p><p><a href="index.html">← رجوع للمتجر</a></p><script>const q=new URLSearchParams(location.search);const slug=q.get('p')||'';document.getElementById('ref').textContent=slug?slug.toUpperCase().slice(0,12)+'-'+Date.now().toString(16).toUpperCase():'—';fetch('payments.json').then(r=>r.json()).then(d=>{const pr=(d.products||{})[slug]||{};if(pr.price){document.getElementById('price').textContent=pr.price+' '+(pr.currency||d.currency||'USD');}if(pr.link){document.getElementById('p').innerHTML='<a href="'+pr.link+'">'+slug+' — ادفع الآن</a>';}}).catch(()=>{});</script></body></html>
